name: Deploy to Cloudflare Pages

# Auto-deploys on every push to main, plus manual trigger from the Actions tab.
# Mirrors what the wrangler CLI does locally, just driven by GitHub Actions so
# git push is the only deploy gesture you need.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  - the token already in Website Builder/setup-tokens.env
#   CLOUDFLARE_ACCOUNT_ID - the account ID already in Website Builder/setup-tokens.env

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Cancel an in-flight deploy if a newer commit lands on main before it finishes.
# Keeps the live site on the latest commit instead of an older one finishing last.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npx next build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # NOTE: wrangler-action splits `command:` on newlines into separate
          # invocations. Don't interpolate multi-line values (e.g. commit messages)
          # into this field — they'll be parsed as additional wrangler commands.
          # --commit-hash is single-line and safe; --commit-message omitted on purpose.
          command: pages deploy out --project-name=harry-website --branch=main --commit-hash=${{ github.sha }}
